<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"
  >
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRS AIP Desktop 正在启动</title>
  <style>
    :root {
      color: #18243a;
      background: #f5f7fa;
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
      background:
        radial-gradient(circle at 18% 8%, rgb(34 100 210 / 12%), transparent 42%),
        linear-gradient(145deg, #ffffff 0%, #f3f7fd 60%, #edf3fb 100%);
    }

    main {
      position: relative;
      display: flex;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgb(29 79 151 / 12%);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 85%);
    }

    .logo {
      width: 88px;
      height: 88px;
      margin-bottom: 18px;
      filter: drop-shadow(0 12px 18px rgb(27 75 163 / 18%));
    }

    h1 {
      margin: 0;
      color: #18243a;
      font-size: 24px;
      font-weight: 650;
      letter-spacing: 0.2px;
    }

    .status {
      display: flex;
      min-height: 24px;
      margin-top: 18px;
      align-items: center;
      gap: 10px;
      color: #52627b;
      font-size: 14px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgb(31 98 196 / 20%);
      border-top-color: #1f62c4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .hint {
      margin: 8px 0 0;
      color: #8b97a9;
      font-size: 12px;
    }

    .company {
      position: absolute;
      bottom: 18px;
      margin: 0;
      color: #77859a;
      font-size: 12px;
      letter-spacing: 0.3px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: none;
        border-color: #1f62c4;
      }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="../build/app-icon.png" alt="">
    <h1>TRS AIP Desktop</h1>
    <div class="status" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span>正在启动本地智能服务…</span>
    </div>
    <p class="hint">首次启动可能需要更长时间</p>
    <p class="company">广州拓尔思大数据有限公司</p>
  </main>
</body>
</html>
